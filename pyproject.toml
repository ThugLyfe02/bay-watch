[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-scout"
version = "0.1.0"
description = "A policy-aware auction research and bid scheduling workbench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
auction-scout = "auction_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

